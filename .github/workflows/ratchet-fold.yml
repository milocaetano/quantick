name: Ratchet fold

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: ratchet-fold
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  fold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/rust-setup
      - name: Tighten and fold into one maintenance PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/ratchet_fold.py
