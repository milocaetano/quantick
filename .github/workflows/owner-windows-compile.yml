name: Owner Windows compile-only
on:
  push:
    branches: ['feat/quick-range-conversion-plan']
permissions:
  contents: read
jobs:
  compile:
    if: github.event.before == '0058bf9868703d2ce8350e6b9f2e207a0e7fe919' && github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OWNER_PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      - name: Create transport directory, then synthetic packaging checks
        run: |
          New-Item -ItemType Directory -Path C:/owner-transport -ErrorAction Stop | Out-Null
          python -B -m unittest discover -s tools/owner_delivery -p test_hosted*.py -v 2>&1 | Tee-Object -FilePath C:/owner-transport/synthetic-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile immutable pair only
        run: python -B tools/owner_delivery/hosted.py compile --binding tools/owner_delivery/compile-binding.json --repo $env:GITHUB_WORKSPACE
      - name: Preserve first failure and compiled transport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-compile-${{ github.sha }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          compression-level: 0
          path: |
            C:/owner-transport/**
            C:/qperf/receipts/**
            C:/qperf/*.json
            C:/qperf/*.jsonl
            C:/qperf/*-source.zip
      - name: Preserve completed binaries after a failed compile or package
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: owner-compile-partial-binaries-${{ github.sha }}-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          compression-level: 0
          path: |
            C:/qperf/B-target/**/*.exe
            C:/qperf/B-target/**/*.pdb
            C:/qperf/C-target/**/*.exe
            C:/qperf/C-target/**/*.pdb
