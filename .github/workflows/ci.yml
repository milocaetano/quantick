name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` and `labeled` are not in the default set. The first
    # runs full CI when a draft becomes ready; the second lets a draft ask for
    # it with the `full-ci` label before that. See the `if:` on each job.
    types: [opened, synchronize, reopened, ready_for_review, labeled]

env:
  CARGO_TERM_COLOR: always
  # Debug info, not optimisation, is what the runners spend their time on.
  # `[profile.dev]` in the root `Cargo.toml` sets `opt-level = 1` for the
  # workspace and 2 for its dependencies so the chart runs at a usable frame
  # rate under `cargo run`, and it leaves `debug` at cargo's default: full
  # DWARF on Linux, a full PDB on Windows. A CI runner never opens a debugger.
  # It needs one thing out of debug info — the file and line in a failing
  # test's backtrace — and `line-tables-only` is exactly that and nothing
  # else, so the compiler stops emitting, and the linker stops writing, the
  # variable and type tables nobody here reads.
  #
  # Set here rather than in `Cargo.toml` or `.cargo/config.toml` deliberately:
  # both of those would follow the repository onto the trader's machine and
  # take the local debugging experience with them. A workflow-level `env` is
  # read by cargo as a profile override on these runners alone, and the file
  # that defines the dev profile stays as 5e423c55 left it.
  #
  # One variable covers both builds the jobs do: the built-in `test` profile
  # inherits `dev`, and a workspace member's dependencies are dev-profile
  # units too, so the override reaches every unit every job compiles.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Which jobs run where. A draft push runs `fast` alone: fmt, clippy and the
# tests of the crates the diff reaches. The full verdict is nine jobs — `ci`,
# `linux-tests`, `harness-app`, `harness-combined` and `harness-scenario` on
# Linux, `windows`, `windows-tests`, `windows-heavy-tests` and
# `windows-app-tests` on Windows — and they run on every push to main, every
# push to a ready PR, the flip to ready, and on a draft carrying the `full-ci`
# label. `pr-gate` refuses `gh pr ready` until every one of them is green at
# the exact head, and the final verifier requires the same, so a skipped full
# job never stands in for a passing one. The names are `FULL_CI_CHECKS` in
# .claude/hooks/full_ci.sh, and guardrails_test.sh fails when a name there has
# no job here. The rules live in .claude/hooks/README.md, "Full CI at the exact
# head".
#
# They were two serial jobs, 43 minutes on Linux and 15 on Windows, and the
# time was in work nothing could overlap inside a single runner: eleven harness
# feature sets each relinking quantick-app, one `cargo test --workspace` per
# platform, and — on Linux — eighteen minutes of a Python step that scanned the
# debug binary once per registry name. The scan reads the binary once now
# (tools/ci/binary_hook_scan.py); the rest is split across runners. Every job
# carries the steps it carried before, with the same commands.
#
# What is left after the debug-info cut above is one shape: a job is as long as
# the longest single run of `cargo` inside it, so the remaining reductions come
# from putting two such runs on two runners rather than one. `ci` handed its
# `cargo test --workspace` to `linux-tests`, `windows-tests` handed half its
# crates to `windows-heavy-tests`, and the eleven harness builds were dealt
# again across the same three jobs so no one of them owns three long relinks.
# None of that changes a command or its arguments.
#
# One cache per platform, written by the job that builds the whole workspace on
# it — `ci` on Linux, `windows` on Windows — and restored by the rest. The
# cache action prunes the workspace's own artifacts before saving, so a job
# recompiles this repository's crates either way; what it restores is the
# dependency graph, which is why a second test job costs a relink and not a
# cold build.
jobs:
  fast:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft &&
      github.event.action != 'labeled'
    runs-on: ubuntu-latest
    # A newer push to the same draft makes an older signal worthless.
    concurrency:
      group: fast-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The affected set diffs the PR's base against its head, and both
          # must be in the clone.
          fetch-depth: 0
      - uses: ./.github/actions/rust-setup
      - name: Affected crates
        # Derived from `cargo metadata` and the diff, never a list kept here;
        # the script's stderr says why each crate was selected.
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/ci/affected_crates.py --base "$BASE_SHA" --head "$HEAD_SHA" > affected.txt
          echo "packages=$(sed 's/^/-p /' affected.txt | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy ${{ steps.affected.outputs.packages }} --all-targets
      - name: Test
        run: cargo test ${{ steps.affected.outputs.packages }}

  read-cost:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The measurement's whole point is to reach the author, and it reaches
      # them as a comment on the pull request they are already reading.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The calculator reads both immutable PR objects. A shallow checkout
          # can contain only GitHub's synthetic merge commit and would make a
          # missing base look like a zero-cost change.
          fetch-depth: 0
          # Execute the calculator and frozen production lexer from the exact
          # head named in the artifact, not from a synthetic merge worktree.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Measure direct source read cost
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p artifacts
          python3 tools/read_cost/measure.py \
            --repo . --base "$BASE_SHA" --head "$HEAD_SHA" \
            > artifacts/read-cost.json
          cat artifacts/read-cost.json
      - name: Upload SHA-bound read cost
        uses: actions/upload-artifact@v4
        with:
          name: read-cost-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/read-cost.json
          if-no-files-found: error
      - name: Post the sticky read-cost comment
        # One comment per pull request, updated in place. The marker in the
        # rendered body is the key: a comment per push would bury the number
        # it exists to show, and the artifact above is already the evidence
        # nobody opens.
        #
        # Failing here would redden a pull request over a comment, so the step
        # reports and continues. The artifact and the ledger are unaffected.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 tools/read_cost/report.py comment \
            --json artifacts/read-cost.json --pr "$PR" \
            --ledger docs/quality/read-cost/ledger.md > artifacts/read-cost.md
          python3 - <<'PY' > artifacts/read-cost-comment.json
          import json, pathlib
          body = pathlib.Path("artifacts/read-cost.md").read_text(encoding="utf-8")
          print(json.dumps({"body": body}))
          PY
          # The key comes from the renderer, never from a copy spelled here:
          # a stale copy stops matching and every build posts a new comment.
          MARKER=$(python3 tools/read_cost/report.py marker)
          export MARKER
          # Written out and then read, rather than piped into `head`: closing
          # the pipe early kills `gh` with SIGPIPE, and under a pipefail shell
          # that turns "the comment exists" into "the step failed".
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.body | startswith(env.MARKER)) | .id' \
            > artifacts/read-cost-comment-ids.txt
          existing=$(head -n 1 artifacts/read-cost-comment-ids.txt)
          if [ -n "$existing" ]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              --input artifacts/read-cost-comment.json > /dev/null
            echo "updated comment $existing"
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              --input artifacts/read-cost-comment.json > /dev/null
            echo "posted a new comment"
          fi

  # The ledger is the half of this that outlives the pull request. A comment
  # expires with the branch; `docs/quality/read-cost/ledger.md` is where the
  # trend lives, and where the ceiling the warning cites comes from.
  #
  # Each pull request carries its own row, written on the branch before the
  # merge, so this job checks rather than writes. Writing it here would mean a
  # push to `main`, which the repository's ruleset allows no bot to do: the
  # Actions app cannot be a bypass actor on a personal repository, and the
  # alternative is a long-lived write credential in CI to work around a rule
  # the repository chose on purpose.
  read-cost-ledger:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Check the merged pull request left its row
        # An annotation, never a failure. The row can no longer be added by
        # the pull request that owed it, and reddening `main` over a line of
        # Markdown would punish the next branch for the last one's omission.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/read_cost/ledger.py \
            --ledger docs/quality/read-cost/ledger.md \
            verify --commit "$GITHUB_SHA"

  ci:
    if: &full-ci >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'full-ci') ||
      (github.event.action != 'labeled' &&
       (!github.event.pull_request.draft ||
        contains(github.event.pull_request.labels.*.name, 'full-ci')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent guardrails
        # The hooks in .claude/settings.json are what keep an agent session off
        # the main checkout and off an un-reviewed PR. Nothing in cargo test
        # touches them, so they get their own step. The suite builds its own
        # throwaway repos for the hook cases, with one deliberate exception:
        # its last block reads this checkout's CLAUDE.md and .claude/ prose to
        # pin that the marker names the gate reads are the ones the
        # instructions tell an agent to write. So this step can go red on a
        # docs-only PR that renames a marker on one side, which is the point.
        run: sh .claude/hooks/guardrails_test.sh
      - name: Python tooling lint
        # The MetaTrader bridge and the session exporter are Python, so not one
        # of the cargo steps below can see them. An undefined name reached main
        # on 2026-08-13 and killed every replay download for a day, because
        # Python resolves names only when the line runs and that line runs on a
        # logged-in terminal nobody has in CI. `--select F` is pyflakes' rule
        # set — the one that catches a name that cannot resolve — and it runs
        # before the slow steps so this class of bug fails in seconds.
        # The glob is `tools/`, not `tools/mt5/`: a Python file that lands
        # anywhere under tools/ is linted the moment it exists, rather than when
        # somebody remembers to widen this line. `tools/heatmap-lab/` arrived
        # that way.
        run: pipx run ruff check --select F tools/ bridge/mt5/
      - name: Exporter tests
        # Drives export_session.py end to end against a fake terminal: no
        # MetaTrader, no network, no credentials, nothing to install.
        run: python3 tools/mt5/test_export_session.py
      - name: Outside-score measurement tests
        # Every measured row the outside-score rubric grades comes from this
        # lexer. A regression in it moves scores without any code changing, so
        # its fixtures run here, beside the other offline tool suites.
        run: python3 tools/outside_score/test_measure.py
      - name: Read-cost tests
        # The calculator: explicit Git revisions, Rust module layouts,
        # direct-only reference scope, deduplication, and delete/rename
        # pre-images. Then what is done with its answer - the sticky comment,
        # the ledger rows, the median the ceiling came from, and the advisory
        # `pr-gate` prints. Discovered rather than named, so a suite added
        # beside these runs the moment it exists.
        run: python3 -m unittest discover -s tools/read_cost -p 'test_*.py'
      - name: Binary hook scan tests
        # The scan below reads a half-gigabyte binary, so its own cases run
        # against fixtures instead: the boundary rule, the prose exemption, and
        # both failure directions.
        run: python3 tools/ci/test_binary_hook_scan.py
      - name: Edit-loop safety fixtures
        run: python3 -m unittest discover -s tools/edit_loop -p 'test_*.py'
      - name: Bridge tests
        # Same shape, for the bridge itself: a fake terminal, no MetaTrader.
        # It covers which ticks the live pump asks for, how "load older" walks
        # backwards, and where the opening block starts — behaviour cargo
        # cannot see and ruff cannot judge, so without this step a revert to
        # COPY_TICKS_ALL, or to a clock-anchored backfill, ships green.
        #
        # The glob is deliberate: a suite added beside these is run the moment
        # it exists, rather than when someone remembers to name it here. It is
        # also what `cargo test -p quantick-feed-mt5 --test bridge_paging`
        # does, so the two cannot disagree about which suites are covered.
        #
        # Every suite runs and the step fails if any did, rather than reporting
        # whichever ran last: a loop whose exit code is its final command turns
        # a red suite green the moment another one is added after it.
        run: |
          failed=0
          for suite in bridge/mt5/tests/test_*.py; do
            echo "== $suite"
            python3 "$suite" || failed=1
          done
          exit "$failed"
      - name: Supply chain (bans, licenses)
        # Deliberately not `advisories`. These two checks are pure functions of
        # the committed `Cargo.lock`: they can only change when a commit
        # changes the dependency graph, so they belong on the pull request,
        # where a red means this branch did something. `advisories` reads the
        # RustSec database, which moves on its own and would redden a change
        # that never touched the dependency — it runs on a schedule instead,
        # in `supply-chain.yml`. `deny.toml` owns the policy both read.
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check bans licenses
      - uses: ./.github/actions/rust-setup
        with:
          # The job that builds the whole workspace is the job that saves the
          # cache: its target directory is the complete one, and a harness job
          # holding only the app's feature builds must never overwrite it.
          save-cache: "true"
          verbose-toolchain: "true"
      - name: Windows test coverage
        # The two Windows test jobs must still be complements. Both the guard
        # and its own cases read `cargo metadata` for the member list, so they
        # run after the toolchain rather than beside the cargo-free suites.
        run: |
          python3 tools/ci/test_windows_test_coverage.py
          python3 tools/ci/windows_test_coverage.py
      - name: Affected-crates tests
        # The fast draft job's crate selection. Its workspace cases compare the
        # reverse-dependency closure with `cargo tree --invert`, so they run
        # after the toolchain is installed.
        run: python3 tools/ci/test_affected_crates.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        # No `-D warnings` here any more. The levels live in the
        # `[workspace.lints]` table in the root `Cargo.toml`, which every crate
        # inherits, so `cargo clippy -p <crate>` on a laptop fails on exactly
        # what this step fails on. While the flag lived here, a session could
        # get a clean local run and a red CI out of the same code, and spend
        # itself looking for the difference in its own diff.
        run: cargo clippy --workspace --all-targets
      - name: Build
        run: cargo build --workspace
      - name: Default binary names no harness hook
        # The shipped bytes, not the source: `Build` just made the default
        # binary, and nothing has rebuilt it with a feature yet. The
        # composition root's declared configuration must be present — the
        # control that proves the scan can see a name at all; every other
        # registry name is a harness hook and must be absent.
        run: python3 tools/ci/binary_hook_scan.py

  # `cargo test --workspace` was 263s of the 508s `ci` took, and it is one
  # command: nothing inside `ci` could overlap with it, and everything else in
  # that job — the hook suite, the Python tool suites, the supply-chain check,
  # fmt, clippy, the workspace build and the binary scan — adds up to less.
  # Handing the run its own runner makes both halves shorter than the job they
  # came from. It is the same command with the same arguments, and it is still
  # `--workspace`, so a crate added on Monday is tested on Monday with no guard
  # needed; the Windows side has three selectors and therefore has one.
  linux-tests:
    if: *full-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - name: Test
        run: cargo test --workspace

  # The app's harness feature sets, split across three jobs so the relinks
  # overlap. Every one of them is a check the serial job ran before, with the
  # same command; the split changes where they run, never whether. Which job
  # carries which set is a balancing decision and nothing more — the sets are
  # independent, so any partition runs the same eleven builds.
  #
  # The deal was made again once the debug-info cut changed what each build
  # costs. Every `cargo test` here relinks quantick-app under a feature set it
  # has not linked before, at roughly 110s to 170s, and the `cargo check` steps
  # cost a tenth of that; three long relinks in one job was 430s while another
  # job sat at 251s. Each job now owns two long relinks and some change, which
  # is why a set sometimes sits beside a family it is not named after.
  harness-app:
    if: *full-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - name: Test opt-in quick-range harness
        run: cargo test -p quantick-app --features quick-range-harness
      - name: Test opt-in drawing harness
        run: cargo test -p quantick-app --features drawing-harness
      - name: Check control and quick-range harnesses
        run: cargo check -p quantick-app --all-targets --features control-harness,quick-range-harness
      - name: Check control and drawing harnesses
        run: cargo check -p quantick-app --all-targets --features control-harness,drawing-harness

  harness-combined:
    if: *full-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - name: Test combined drawing harnesses
        run: cargo test -p quantick-app --features drawing-harness,quick-range-harness
      - name: Test all app harness families
        run: cargo test -p quantick-app --features harness
      - name: Build the capture binary
        # What `ui-harness` launches: every family, outside `cfg(test)`. It
        # stays beside the step above because both are `--features harness`:
        # the test run has just compiled that feature set, so the build is a
        # link and not a second compile.
        run: cargo build -p quantick-app --features harness

  harness-scenario:
    if: *full-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - name: Test opt-in scenario harness
        run: cargo test -p quantick-app --features scenario-harness
      - name: Test opt-in control harness
        run: cargo test -p quantick-app --features control-harness
      - name: Check scenario and control harnesses
        run: cargo check -p quantick-app --all-targets --features scenario-harness,control-harness
      - name: Check scenario and drawing harnesses
        run: cargo check -p quantick-app --all-targets --features scenario-harness,drawing-harness
      - name: Check scenario and quick-range harnesses
        run: cargo check -p quantick-app --all-targets --features scenario-harness,quick-range-harness

  # The second operating system the README is allowed to claim. It exists so
  # that sentence is backed by a workflow file rather than by memory: the
  # trader runs quantick on Windows every day, and until this job every line of
  # evidence for that was a screenshot.
  #
  # Full verification parity, not merely a cross-platform compile. Retain the
  # named control-local diagnostic for real Windows owner/ACL/junction cases.
  # These tests need no GPU, window or MetaTrader terminal.
  windows:
    if: *full-ci
    runs-on: windows-latest
    env:
      QUANTICK_BUBBLES: ${{ github.workspace }}/crates/app/config/bubbles.toml
    steps:
      - uses: actions/checkout@v4
      - name: Edit-loop Windows safety fixtures
        run: python -m unittest discover -s tools/edit_loop -p 'test_*.py'
      - uses: ./.github/actions/rust-setup
        with:
          # No apt on this runner, and this is the Windows job that builds the
          # whole workspace, so it is the one that saves the Windows cache.
          desktop-deps: "false"
          cache-key: windows
          save-cache: "true"
          verbose-toolchain: "true"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets
      - name: Build
        run: cargo build --workspace
      - name: Test Windows descriptor authority and local transport
        # Keep test names and token-free fixture prerequisites in exact-head logs.
        run: cargo test -p quantick-control-local -- --nocapture

  # `cargo test --workspace` was 8m 53s of the Windows job's 15m 08s, and one
  # crate owns most of it. The three jobs below are a partition of the
  # workspace — the six crates that own half its test binaries, everything else
  # but quantick-app, and quantick-app — so together they run exactly what the
  # single `--workspace` run ran, each crate once.
  #
  # The `--exclude` list and the `-p` list are the same six names, read in
  # opposite directions, which is exactly the pair that rots when one side is
  # edited. Nothing in a workflow file checks that, so
  # `tools/ci/windows_test_coverage.py` reads the selectors back out of this
  # file and compares them with `cargo metadata`: it fails on a crate no share
  # tests and on a crate two shares both test. A share is a step named `Test`,
  # which is why `windows` above may run one crate again under a step named for
  # the diagnostic it is. The guard runs in `ci`.
  #
  # The six were chosen by test-binary count — 57 of the 113 the non-app half
  # builds — because the time is in linking those binaries, not in running
  # them. Rebalancing the lists is a one-line edit the guard re-proves.
  windows-heavy-tests:
    if: *full-ci
    runs-on: windows-latest
    env:
      QUANTICK_BUBBLES: ${{ github.workspace }}/crates/app/config/bubbles.toml
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          desktop-deps: "false"
          cache-key: windows
      - name: Test
        run: cargo test -p quantick-engine -p quantick-control -p quantick-pine -p quantick-indicators -p quantick-workspace -p quantick-guards

  windows-tests:
    if: *full-ci
    runs-on: windows-latest
    env:
      QUANTICK_BUBBLES: ${{ github.workspace }}/crates/app/config/bubbles.toml
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          desktop-deps: "false"
          cache-key: windows
      - name: Test
        run: cargo test --workspace --exclude quantick-app --exclude quantick-engine --exclude quantick-control --exclude quantick-pine --exclude quantick-indicators --exclude quantick-workspace --exclude quantick-guards

  windows-app-tests:
    if: *full-ci
    runs-on: windows-latest
    env:
      QUANTICK_BUBBLES: ${{ github.workspace }}/crates/app/config/bubbles.toml
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          desktop-deps: "false"
          cache-key: windows
      - name: Test
        run: cargo test -p quantick-app
