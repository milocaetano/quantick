name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` and `labeled` are not in the default set. The first
    # runs full CI when a draft becomes ready; the second lets a draft ask for
    # it with the `full-ci` label before that. See the `if:` on each job.
    types: [opened, synchronize, reopened, ready_for_review, labeled]

env:
  CARGO_TERM_COLOR: always

# Which jobs run where. A draft push runs `fast` alone: fmt, clippy and the
# tests of the crates the diff reaches. The full verdict is seven jobs — `ci`,
# `harness-app`, `harness-combined` and `harness-scenario` on Linux, `windows`,
# `windows-tests` and `windows-app-tests` on Windows — and they run on every
# push to main, every push to a ready PR, the flip to ready, and on a draft
# carrying the `full-ci` label. `pr-gate` refuses `gh pr ready` until every one
# of them is green at the exact head, and the final verifier requires the same,
# so a skipped full job never stands in for a passing one. The names are
# `FULL_CI_CHECKS` in .claude/hooks/full_ci.sh, and guardrails_test.sh fails
# when a name there has no job here. The rules live in
# .claude/hooks/README.md, "Full CI at the exact head".
#
# They were two serial jobs, 43 minutes on Linux and 15 on Windows, and the
# time was in work nothing could overlap inside a single runner: eleven harness
# feature sets each relinking quantick-app, one `cargo test --workspace` per
# platform, and — on Linux — eighteen minutes of a Python step that scanned the
# debug binary once per registry name. The scan reads the binary once now
# (tools/ci/binary_hook_scan.py); the rest is split across runners. Every job
# carries the steps it carried before, with the same commands.
#
# One cache per platform, written by the job that builds the whole workspace on
# it — `ci` on Linux, `windows` on Windows — and restored by the rest.
jobs:
  fast:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft &&
      github.event.action != 'labeled'
    runs-on: ubuntu-latest
    # A newer push to the same draft makes an older signal worthless.
    concurrency:
      group: fast-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The affected set diffs the PR's base against its head, and both
          # must be in the clone.
          fetch-depth: 0
      - uses: ./.github/actions/rust-setup
      - name: Affected crates
        # Derived from `cargo metadata` and the diff, never a list kept here;
        # the script's stderr says why each crate was selected.
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/ci/affected_crates.py --base "$BASE_SHA" --head "$HEAD_SHA" > affected.txt
          echo "packages=$(sed 's/^/-p /' affected.txt | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy ${{ steps.affected.outputs.packages }} --all-targets
      - name: Test
        run: cargo test ${{ steps.affected.outputs.packages }}

  read-cost:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The calculator reads both immutable PR objects. A shallow checkout
          # can contain only GitHub's synthetic merge commit and would make a
          # missing base look like a zero-cost change.
          fetch-depth: 0
          # Execute the calculator and frozen production lexer from the exact
          # head named in the artifact, not from a synthetic merge worktree.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Measure direct source read cost
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p artifacts
          python3 tools/read_cost/measure.py \
            --repo . --base "$BASE_SHA" --head "$HEAD_SHA" \
            > artifacts/read-cost.json
          cat artifacts/read-cost.json
      - name: Upload SHA-bound read cost
        uses: actions/upload-artifact@v4
        with:
          name: read-cost-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/read-cost.json
          if-no-files-found: error

  ci:
    if: &full-ci >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'full-ci') ||
      (github.event.action != 'labeled' &&
       (!github.event.pull_request.draft ||
        contains(github.event.pull_request.labels.*.name, 'full-ci')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent guardrails
        # The hooks in .claude/settings.json are what keep an agent session off
        # the main checkout and off an un-reviewed PR. Nothing in cargo test
        # touches them, so they get their own step. The suite builds its own
        # throwaway repos for the hook cases, with one deliberate exception:
        # its last block reads this checkout's CLAUDE.md and .claude/ prose to
        # pin that the marker names the gate reads are the ones the
        # instructions tell an agent to write. So this step can go red on a
        # docs-only PR that renames a marker on one side, which is the point.
        run: sh .claude/hooks/guardrails_test.sh
      - name: Python tooling lint
        # The MetaTrader bridge and the session exporter are Python, so not one
        # of the cargo steps below can see them. An undefined name reached main
        # on 2026-08-13 and killed every replay download for a day, because
        # Python resolves names only when the line runs and that line runs on a
        # logged-in terminal nobody has in CI. `--select F` is pyflakes' rule
        # set — the one that catches a name that cannot resolve — and it runs
        # before the slow steps so this class of bug fails in seconds.
        # The glob is `tools/`, not `tools/mt5/`: a Python file that lands
        # anywhere under tools/ is linted the moment it exists, rather than when
        # somebody remembers to widen this line. `tools/heatmap-lab/` arrived
        # that way.
        run: pipx run ruff check --select F tools/ bridge/mt5/
      - name: Exporter tests
        # Drives export_session.py end to end against a fake terminal: no
        # MetaTrader, no network, no credentials, nothing to install.
        run: python3 tools/mt5/test_export_session.py
      - name: Outside-score measurement tests
        # Every measured row the outside-score rubric grades comes from this
        # lexer. A regression in it moves scores without any code changing, so
        # its fixtures run here, beside the other offline tool suites.
        run: python3 tools/outside_score/test_measure.py
      - name: Read-cost measurement tests
        # Exercises explicit Git revisions, Rust module layouts, direct-only
        # reference scope, deduplication, and delete/rename pre-images.
        run: python3 tools/read_cost/test_measure.py
      - name: Binary hook scan tests
        # The scan below reads a half-gigabyte binary, so its own cases run
        # against fixtures instead: the boundary rule, the prose exemption, and
        # both failure directions.
        run: python3 tools/ci/test_binary_hook_scan.py
      - name: Edit-loop safety fixtures
        run: python3 -m unittest discover -s tools/edit_loop -p 'test_*.py'
      - name: Bridge tests
        # Same shape, for the bridge itself: a fake terminal, no MetaTrader.
        # It covers which ticks the live pump asks for, how "load older" walks
        # backwards, and where the opening block starts — behaviour cargo
        # cannot see and ruff cannot judge, so without this step a revert to
        # COPY_TICKS_ALL, or to a clock-anchored backfill, ships green.
        #
        # The glob is deliberate: a suite added beside these is run the moment
        # it exists, rather than when someone remembers to name it here. It is
        # also what `cargo test -p quantick-feed-mt5 --test bridge_paging`
        # does, so the two cannot disagree about which suites are covered.
        #
        # Every suite runs and the step fails if any did, rather than reporting
        # whichever ran last: a loop whose exit code is its final command turns
        # a red suite green the moment another one is added after it.
        run: |
          failed=0
          for suite in bridge/mt5/tests/test_*.py; do
            echo "== $suite"
            python3 "$suite" || failed=1
          done
          exit "$failed"
      - name: Supply chain (bans, licenses)
        # Deliberately not `advisories`. These two checks are pure functions of
        # the committed `Cargo.lock`: they can only change when a commit
        # changes the dependency graph, so they belong on the pull request,
        # where a red means this branch did something. `advisories` reads the
        # RustSec database, which moves on its own and would redden a change
        # that never touched the dependency — it runs on a schedule instead,
        # in `supply-chain.yml`. `deny.toml` owns the policy both read.
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check bans licenses
      - uses: ./.github/actions/rust-setup
        with:
          # The job that builds the whole workspace is the job that saves the
          # cache: its target directory is the complete one, and a harness job
          # holding only the app's feature builds must never overwrite it.
          save-cache: "true"
          verbose-toolchain: "true"
      - name: Windows test coverage
        # The two Windows test jobs must still be complements. Both the guard
        # and its own cases read `cargo metadata` for the member list, so they
        # run after the toolchain rather than beside the cargo-free suites.
        run: |
          python3 tools/ci/test_windows_test_coverage.py
          python3 tools/ci/windows_test_coverage.py
      - name: Affected-crates tests
        # The fast draft job's crate selection. Its workspace cases compare the
        # reverse-dependency closure with `cargo tree --invert`, so they run
        # after the toolchain is installed.
        run: python3 tools/ci/test_affected_crates.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        # No `-D warnings` here any more. The levels live in the
        # `[workspace.lints]` table in the root `Cargo.toml`, which every crate
        # inherits, so `cargo clippy -p <crate>` on a laptop fails on exactly
        # what this step fails on. While the flag lived here, a session could
        # get a clean local run and a red CI out of the same code, and spend
        # itself looking for the difference in its own diff.
        run: cargo clippy --workspace --all-targets
      - name: Build
        run: cargo build --workspace
      - name: Default binary names no harness hook
        # The shipped bytes, not the source: `Build` just made the default
        # binary, and nothing has rebuilt it with a feature yet. The
        # composition root's declared configuration must be present — the
        # control that proves the scan can see a name at all; every other
        # registry name is a harness hook and must be absent.
        run: python3 tools/ci/binary_hook_scan.py
      - name: Test
        run: cargo test --workspace

  # The app's harness feature sets, split across three jobs so the relinks
  # overlap. Every one of them is a check the serial job ran before, with the
  # same command; the split changes where they run, never whether. Which job
  # carries which set is a balancing decision and nothing more — the sets are
  # independent, so any partition runs the same eleven builds.
  harness-app:
    if: *full-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - name: Test opt-in quick-range harness
        run: cargo test -p quantick-app --features quick-range-harness
      - name: Test opt-in drawing harness
        run: cargo test -p quantick-app --features drawing-harness
      - name: Test opt-in control harness
        run: cargo test -p quantick-app --features control-harness

  harness-combined:
    if: *full-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - name: Test combined drawing harnesses
        run: cargo test -p quantick-app --features drawing-harness,quick-range-harness
      - name: Check control and quick-range harnesses
        run: cargo check -p quantick-app --all-targets --features control-harness,quick-range-harness
      - name: Check control and drawing harnesses
        run: cargo check -p quantick-app --all-targets --features control-harness,drawing-harness
      - name: Test all app harness families
        run: cargo test -p quantick-app --features harness
      - name: Build the capture binary
        # What `ui-harness` launches: every family, outside `cfg(test)`.
        run: cargo build -p quantick-app --features harness

  harness-scenario:
    if: *full-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - name: Test opt-in scenario harness
        run: cargo test -p quantick-app --features scenario-harness
      - name: Check scenario and control harnesses
        run: cargo check -p quantick-app --all-targets --features scenario-harness,control-harness
      - name: Check scenario and drawing harnesses
        run: cargo check -p quantick-app --all-targets --features scenario-harness,drawing-harness
      - name: Check scenario and quick-range harnesses
        run: cargo check -p quantick-app --all-targets --features scenario-harness,quick-range-harness

  # The second operating system the README is allowed to claim. It exists so
  # that sentence is backed by a workflow file rather than by memory: the
  # trader runs quantick on Windows every day, and until this job every line of
  # evidence for that was a screenshot.
  #
  # Full verification parity, not merely a cross-platform compile. Retain the
  # named control-local diagnostic for real Windows owner/ACL/junction cases.
  # These tests need no GPU, window or MetaTrader terminal.
  windows:
    if: *full-ci
    runs-on: windows-latest
    env:
      QUANTICK_BUBBLES: ${{ github.workspace }}/crates/app/config/bubbles.toml
    steps:
      - uses: actions/checkout@v4
      - name: Edit-loop Windows safety fixtures
        run: python -m unittest discover -s tools/edit_loop -p 'test_*.py'
      - uses: ./.github/actions/rust-setup
        with:
          # No apt on this runner, and this is the Windows job that builds the
          # whole workspace, so it is the one that saves the Windows cache.
          desktop-deps: "false"
          cache-key: windows
          save-cache: "true"
          verbose-toolchain: "true"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets
      - name: Build
        run: cargo build --workspace
      - name: Test Windows descriptor authority and local transport
        # Keep test names and token-free fixture prerequisites in exact-head logs.
        run: cargo test -p quantick-control-local -- --nocapture

  # `cargo test --workspace` was 8m 53s of the Windows job's 15m 08s, and one
  # crate owns most of it. The two jobs below are complements — everything but
  # quantick-app, and quantick-app — so together they run exactly what the
  # single `--workspace` run ran. Nothing in a workflow file checks that two
  # selectors are complements, so `tools/ci/windows_test_coverage.py` reads
  # them back out of this file and compares them with `cargo metadata`; it runs
  # in `ci`.
  windows-tests:
    if: *full-ci
    runs-on: windows-latest
    env:
      QUANTICK_BUBBLES: ${{ github.workspace }}/crates/app/config/bubbles.toml
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          desktop-deps: "false"
          cache-key: windows
      - name: Test
        run: cargo test --workspace --exclude quantick-app

  windows-app-tests:
    if: *full-ci
    runs-on: windows-latest
    env:
      QUANTICK_BUBBLES: ${{ github.workspace }}/crates/app/config/bubbles.toml
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          desktop-deps: "false"
          cache-key: windows
      - name: Test
        run: cargo test -p quantick-app
