name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent guardrails
        # The hooks in .claude/settings.json are what keep an agent session off
        # the main checkout and off an un-reviewed PR. Nothing in cargo test
        # touches them, so they get their own step. The suite builds its own
        # throwaway repos for the hook cases, with one deliberate exception:
        # its last block reads this checkout's CLAUDE.md and .claude/ prose to
        # pin that the marker names the gate reads are the ones the
        # instructions tell an agent to write. So this step can go red on a
        # docs-only PR that renames a marker on one side, which is the point.
        run: sh .claude/hooks/guardrails_test.sh
      - name: Python tooling lint
        # The MetaTrader bridge and the session exporter are Python, so not one
        # of the cargo steps below can see them. An undefined name reached main
        # on 2026-08-13 and killed every replay download for a day, because
        # Python resolves names only when the line runs and that line runs on a
        # logged-in terminal nobody has in CI. `--select F` is pyflakes' rule
        # set — the one that catches a name that cannot resolve — and it runs
        # before the slow steps so this class of bug fails in seconds.
        # The glob is `tools/`, not `tools/mt5/`: a Python file that lands
        # anywhere under tools/ is linted the moment it exists, rather than when
        # somebody remembers to widen this line. `tools/heatmap-lab/` arrived
        # that way.
        run: pipx run ruff check --select F tools/ bridge/mt5/
      - name: Exporter tests
        # Drives export_session.py end to end against a fake terminal: no
        # MetaTrader, no network, no credentials, nothing to install.
        run: python3 tools/mt5/test_export_session.py
      - name: Bridge tests
        # Same shape, for the bridge itself: a fake terminal, no MetaTrader.
        # It covers which ticks the live pump asks for, how "load older" walks
        # backwards, and where the opening block starts — behaviour cargo
        # cannot see and ruff cannot judge, so without this step a revert to
        # COPY_TICKS_ALL, or to a clock-anchored backfill, ships green.
        #
        # The glob is deliberate: a suite added beside these is run the moment
        # it exists, rather than when someone remembers to name it here. It is
        # also what `cargo test -p quantick-feed-mt5 --test bridge_paging`
        # does, so the two cannot disagree about which suites are covered.
        #
        # Every suite runs and the step fails if any did, rather than reporting
        # whichever ran last: a loop whose exit code is its final command turns
        # a red suite green the moment another one is added after it.
        run: |
          failed=0
          for suite in bridge/mt5/tests/test_*.py; do
            echo "== $suite"
            python3 "$suite" || failed=1
          done
          exit "$failed"
      - name: Supply chain (bans, licenses)
        # Deliberately not `advisories`. These two checks are pure functions of
        # the committed `Cargo.lock`: they can only change when a commit
        # changes the dependency graph, so they belong on the pull request,
        # where a red means this branch did something. `advisories` reads the
        # RustSec database, which moves on its own and would redden a change
        # that never touched the dependency — it runs on a schedule instead,
        # in `supply-chain.yml`. `deny.toml` owns the policy both read.
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check bans licenses
      - name: Install desktop GUI dependencies
        # quantick-app (egui/eframe + winit) needs these to build/link on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Install the pinned toolchain
        # `rust-toolchain.toml` at the repository root names the exact version
        # and the two components, so nothing is installed by name here. This
        # step used to be `dtolnay/rust-toolchain@stable`, which fetched
        # whatever `stable` meant on the morning the job ran: a toolchain
        # release could turn a pull request red without a line of its code
        # changing, and the session that inherited the red went looking for the
        # bug in a diff that never had one.
        #
        # `rustc --version` comes first and is what does the installing: it
        # goes through the rustup shim, which reads the toolchain file and
        # fetches the pinned version if the runner does not have it. Newer
        # rustup releases changed whether `rustup show` installs on its own, so
        # the step does not depend on that either way — it runs afterwards, for
        # the summary, once the toolchain is certainly present.
        #
        # Every version is echoed because the log is where a future reader
        # checks which toolchain a given run actually used, and because a
        # missing component should fail here, by name, rather than four steps
        # later inside `cargo fmt`.
        run: |
          rustc --version
          rustup show
          cargo --version
          cargo clippy --version
          cargo fmt --version
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        # No `-D warnings` here any more. The levels live in the
        # `[workspace.lints]` table in the root `Cargo.toml`, which every crate
        # inherits, so `cargo clippy -p <crate>` on a laptop fails on exactly
        # what this step fails on. While the flag lived here, a session could
        # get a clean local run and a red CI out of the same code, and spend
        # itself looking for the difference in its own diff.
        run: cargo clippy --workspace --all-targets
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: App tests under CPU contention
        # `Test` runs every test once on an idle runner. A test that quietly
        # assumes a worker thread keeps up with the thread asserting on it
        # passes there, merges, and goes red later on somebody else's pull
        # request: #361, #364, #385 and #403 arrived that way within sixteen
        # hours. Each reproduced only when many copies of the test binary
        # shared the cores, so this step runs exactly that, on the binary
        # `Test` just ran: `tools/ci/contention.sh` finds it with the same
        # `cargo test --workspace` plus `--no-run`, which compiles nothing here.
        #
        # The script's defaults: 24 copies sharing 4 cores, each copy at
        # libtest's default thread count, which follows the affinity mask, so
        # 96 test threads and their workers on 4 vCPUs. Against the tree
        # before #403's fix it named that test in 3 of 9 runs; 2 or 3 cores,
        # and #404's 20 copies on 1 core, never did. The step took 3 to 5
        # minutes over ten runs; `timeout-minutes` caps it at 8.
        # The table is in `docs/quality/app-tests-under-contention.md`.
        #
        # Tests already known to fail under load are skipped by the copies
        # only, one per line in `tools/ci/contention-known-issues.txt`, each
        # naming its issue; `Test` above still runs them. A red step names
        # each failing test and the copy it failed in, and the next step keeps
        # every copy's log. Reproduce on Linux with `sh tools/ci/contention.sh`.
        id: contention
        timeout-minutes: 8
        env:
          CONTENTION_LOGS: ${{ runner.temp }}/contention
        run: sh tools/ci/contention.sh quantick-app
      - name: Keep the contention logs
        if: failure() && steps.contention.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: contention-logs
          path: ${{ runner.temp }}/contention/
          retention-days: 14

  # The second operating system the README is allowed to claim. It exists so
  # that sentence is backed by a workflow file rather than by memory: the
  # trader runs quantick on Windows every day, and until this job every line of
  # evidence for that was a screenshot.
  #
  # Deliberately narrow. `cargo build --workspace` proves the whole tree still
  # compiles for `x86_64-pc-windows-msvc` — which is where a path separator, a
  # `std::os::unix` import or a Windows-only linker error shows up — and the
  # engine and guards tests prove determinism and the ratchets. The separate
  # control-local step executes real Windows owner/ACL/junction fixtures plus
  # loopback transport tests; Linux cannot execute these Windows branches.
  # None needs a GPU, window or MetaTrader terminal. Linux still tests everything.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        # Same reasoning as the Linux job: `rust-toolchain.toml` names the
        # version, and `rustc --version` through the rustup shim is what
        # installs it.
        run: |
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test -p quantick-engine -p quantick-guards
      - name: Test Windows descriptor authority and local transport
        # Keep test names and token-free fixture prerequisites in exact-head logs.
        run: cargo test -p quantick-control-local -- --nocapture
