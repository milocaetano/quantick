# Footprint layer tunables (crates/app/src/footprint_config.rs).
#
# Every knob is optional: an absent one keeps the built-in default, and this
# file's presence changes nothing by itself — the layer still opens off and
# is switched from the toolbar's LAYERS group (left-click; right-click opens
# these settings) or the pane's right-click layer menu. Override the file
# location with QUANTICK_FOOTPRINT=<path>.

# How the ladder is drawn (default "split"). Four readings of the same tape:
#
#   "split"   — volume profile on the right, the winning side's delta bar on
#               the left, yellow POC. The reference look, and the default.
#   "bidask"  — both sides at their real size, mirrored on one scale, no
#               digits. 400x380 and 40x20 share a delta and are not the same
#               market; this is the style that says so. Reads at zooms where
#               numbers cannot fit.
#   "ladder"  — the classic sell|buy quantity columns.
#   "cluster" — each bar in its own boxed ladder: bid, ask and the row total,
#               the cell shaded by how much volume it holds, the candle beside
#               the box rather than behind it. Needs the deepest zoom — three
#               quantities per row is half again the candle width two need —
#               and above that it hands over to "bidask", which the legend
#               announces rather than degrading in silence.
#
# Also reachable without a click: QUANTICK_FOOTPRINT_STYLE=<id>.
#style = "split"

# One side must be at least this many times its diagonal neighbour to count
# as an imbalance (default 3.0, the industry's centre of gravity).
#imbalance_ratio = 3.0

# Absolute floor on the imbalance difference. Unset (default), the floor is
# adaptive — the 60th percentile of per-row volume over the newest closed
# bars — because one fixed number cannot serve WIN contracts and BTC
# fractions at once. Pin it for an instrument you know better.
#imbalance_min_qty = 20.0

# Consecutive same-side imbalances that make a stacked zone (default 3).
#stacked_count = 3

# The thinnest a profile band may draw, in pixels (default 4.0, clamped
# 2–10). Lower = more, finer bands per candle before rows merge.
#profile_row_px = 4.0

# The per-bar POC line (default true).
#show_poc = true

# The aggression ratio badges at a bar's extremes, Detailed level only
# (default true).
#extreme_ratio_badge = true

# Hide badges below this ratio (default 2.0) — a "1.0x" badge is the
# absence of aggression.
#badge_min_ratio = 2.0

# The per-row numbers inside the candles (default true). Off keeps the bars,
# imbalance chips, POC and badges — the shape of the fight, no digits.
#show_numbers = true

# The per-bar delta chips along the chart's bottom edge (default true).
# Every style, not only "split": who won the bar is a reading of the bar,
# orthogonal to how its rows are drawn.
#show_delta_totals = true

# --- "cluster" style only -----------------------------------------------

# The third column, the row total (default true). It is what makes the style
# read like the reference chart, and it costs roughly a third more candle
# width before the numbers fit. Off, the style keeps bid and ask and arrives
# at the same zoom the ladder does.
#cluster_show_total = true

# The raised-cell relief, at the deepest zoom only (default true). Never
# offered at shallower levels at any price: relief on a four-pixel cell is
# dirt, the same reason this layer has no fades.
#cluster_bevel = true
