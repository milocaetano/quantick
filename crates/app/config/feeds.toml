# quantick — feed & asset configuration.
#
# The chart reads its available feeds and symbols from this file instead of
# hard-coding them. Edit it to change what the feed/symbol selectors offer.
#
# Resolution order at startup (first hit wins):
#   1. the file named by the QUANTICK_CONFIG environment variable
#   2. `quantick.toml` in the current working directory
#   3. this file, compiled into the binary as the built-in default
#
# `default_feed` / `default_symbol` pick what the chart opens on; both must
# refer to a feed/symbol that actually exists below.
default_feed = "binance"
default_symbol = "BTCUSDT"

# Each [[feeds]] entry is one selectable feed.
#   id            — stable identifier, referenced by `default_feed` (unique).
#   name          — label shown in the feed selector.
#   provider      — which backend streams it; maps to a code path.
#                   Supported today: "binance", "hyperliquid", "metatrader".
#   symbols       — the assets offered for this feed (first is its fallback).
#   bubble_preset — optional: a bubble preset (by name, from bubbles.toml)
#                   applied whenever this feed is selected. Leave it out and
#                   the panel keeps whatever preset is active. An unknown name
#                   is reported and ignored.
#   default_layout — optional: the canvas layout a tab on this feed opens
#                   showing — "flow" (the default), "time" (a full-window
#                   timeframe chart) or "time+flow" (the split). Startup-only:
#                   it never overrides a layout chosen from View → Layout.
#   default_bars  — optional: the bar spec a tab on this feed opens on, as
#                   "kind:parameter" — time:1m, tick:50, volume:5,
#                   dollar:500000, imbalance:100. Sets the flow pane's opening
#                   spec; with a time-showing default_layout and a time spec,
#                   the timeframe pane opens on that interval too. A spec that
#                   does not parse is refused at load, like any config error.
[[feeds]]
id = "binance"
name = "Binance"
provider = "binance"
symbols = ["BTCUSDT", "ETHUSDT"]
# The default open: timeframe context beside the flow chart, side by side
# (user decision 2026-08-06). Remove the key to open on the flow pane alone.
default_layout = "time+flow"
# ...and the flow chart beside it reads the tape by tick (user decision
# 2026-08-07): two charts, one measuring the clock and one measuring the tape,
# which is the comparison quantick exists to make. The timeframe pane keeps its
# own 1m default — `default_bars` names a time pane's interval only when it is
# itself a time spec.
default_bars = "tick:50"

# Hyperliquid perpetuals, over unauthenticated public REST/WebSocket endpoints.
# These were the five largest non-delisted markets by 24h notional volume in
# `metaAndAssetCtxs` when this built-in seed was reviewed on 2026-08-02. The
# list is deliberately configuration (not provider code), so it remains easy
# to review or override as leadership changes. Hyperliquid publishes factual
# aggressor sides and complete snapshots of its visible top 20 L2 levels; it
# does not expose pageable public trade history, so "load older" is disabled.
[[feeds]]
id = "hyperliquid"
name = "Hyperliquid"
provider = "hyperliquid"
symbols = ["BTC", "ETH", "HYPE", "SOL", "ZEC"]

# MetaTrader 5, via the QuantickBridge EA (see bridge/mt5/README.md for the
# one-time setup). The EA streams the chart it is attached to; the symbol
# selected here must match that chart. The EA also streams Depth of Market, so
# the book heatmap works here; note MT5 exposes only the top levels, and the
# chart labels that coverage rather than implying a full book.
#
# **One terminal serves one account at a time.** That is why there are two
# MetaTrader entries rather than one list: which symbols exist depends on who
# is logged in, and mixing a Tickmill instrument with a B3 one in a single feed
# would offer symbols that cannot resolve. Log into the account you want, then
# pick the matching feed.
#
# Tickmill, a retail broker: XAUUSD is spot gold, US500/US30 are index CFDs.
# A CFD is broker-quoted — it has no tape and no book. The bridge declares
# that, quotes chart as one synthetic print per tick, and everything needing a
# traded size switches itself off. See bridge/mt5/PROTOCOL.md, field `tape`.
[[feeds]]
id = "metatrader-tickmill"
name = "MetaTrader 5 — Tickmill"
provider = "metatrader"
symbols = ["XAUUSD", "US500", "US30"]
bubble_preset = "live lane pie"

# B3 (Brazilian exchange) continuous contracts: WIN$N (mini índice), WDO$N
# (mini dólar). Real exchange instruments — a real tape and a real DOM.
#
# Brokers usually serve the *dated* contract rather than these aliases, and B3
# rolls it every two months (WINQ26, then WINV26). You do not need to edit this
# file for that: add the current contract from the chart's source picker (the
# tab strip's `+`, or Ctrl+T). It is remembered in the file named by the
# QUANTICK_SYMBOLS environment variable, or `quantick-symbols.toml` in the
# working directory when that is unset, and shows up in the symbol selectors
# from then on.
[[feeds]]
id = "metatrader-b3"
name = "MetaTrader 5 — B3"
provider = "metatrader"
symbols = ["WIN$N", "WDO$N"]
# The B3 mini index reads best as per-bar pie summaries: bars close in seconds
# and the candle summary keeps the last bars carrying marks instead of leaving
# the lane window bare.
bubble_preset = "live lane pie"
# The mini index itself goes one step further: its dense 5-point tape reads
# as aggression per price *region*, not per row — the "mini index regions"
# preset folds same-side marks landing in a four-row zone into one bubble
# sized by the zone's summed volume. Per symbol because WDO$N on this same
# feed keeps the feed-wide look above.
symbol_bubble_presets = { "WIN$N" = "mini index regions" }

# MetaTrader bridge settings (defaults shown; the section is optional).
#   listen_addr — where quantick listens for any symbol `ports` does not name;
#                 an EA dials this address.
#   side_source — "tick_rule" (safe default) or "flags". MT5 aggressor flags
#                 are broker-dependent: the B3 broker probed on 2026-07-23
#                 stamped BUY on every tick, so flags there would chart 100%
#                 buys. Verify a broker with tools/mt5/record_ticks.py before
#                 switching to "flags".
[metatrader]
listen_addr = "127.0.0.1:9100"
side_source = "tick_rule"

# quantick starts the bridge for you: selecting this feed is one action, not
# two. It waits a few seconds first, so a bridge you already started by hand —
# or the Expert Advisor sitting on a chart — is left alone and used instead.
#   bridge_autostart — set false to always start the bridge yourself.
#   bridge_command   — program plus arguments; --symbol/--host/--port are
#                      appended from the running feed. Resolved against
#                      quantick's working directory.
bridge_autostart = true
bridge_command = ["python", "bridge/mt5/quantick_bridge.py"]

# ---------------------------------------------------------------------------
# Per-symbol ports — how quantick charts more than one MT5 symbol at a time.
#
# MQL5 sockets are client-only: quantick listens and the EA dials out, one
# connection per port, one symbol per connection. So streaming XAUUSD and US500
# together means two listeners, two EAs, two ports.
#
# Setting up a second symbol, start to finish:
#   1. Give it a port below (any free one; keep them adjacent so they are easy
#      to remember). Two symbols may not share a port, and none may reuse the
#      `listen_addr` port above — quantick refuses the config if they do.
#   2. Open that symbol's chart in MetaTrader and drag QuantickBridge onto it.
#   3. Set that chart's `InpPort` input to the same number. This is the whole
#      pairing: the port is the only thing connecting a chart to a feed.
#   4. Repeat per symbol. One EA per chart — never two EAs on one port.
#
# Get step 3 wrong and both sides say so rather than sitting quiet: quantick
# logs MT5_SESSION_BUSY and closes the second connection, and the EA's Experts
# tab shows BRIDGE_DISCONNECTED as it retries.
#
# A symbol with no entry here uses `listen_addr` (9100). Several such symbols
# are fine one at a time — WIN$N and WDO$N above share 9100 — but only one of
# them can stream at once; the second reports MT5_BIND_FAILED. Give it a port
# here to run both together. Every key here must be a symbol one of the
# metatrader feeds above actually offers; quantick refuses a key that matches
# none, since its only other symptom would be silently using 9100.
#
# NOTE for editors: this is a sub-table of [metatrader], so it must stay at the
# end of that section. Any plain key written after it would land in here.
[metatrader.ports]
XAUUSD = 9101
US500 = 9102
US30 = 9103

# ---------------------------------------------------------------------------
# Paper trading.
#
# Closed simulated trades are journaled the moment they close, one CSV per
# session under a folder per symbol, and exports land beside them. This is
# also the integration port for other producers: anything writing the
# `quantick-trades` format into this folder — a future bot runner, another
# tool — shows up in the Trades ledger, the report and the export, no wiring
# needed. Relative paths resolve against quantick's working directory; the
# QUANTICK_TRADES_DIR environment variable overrides the setting for one run,
# and the folder picker in the Trading tab (remembered in paper-state.toml)
# wins over this base. The section is optional; absent, trades save under
# the user's documents folder (`Documents/Quantick/paper-trades`), the one
# home that does not move with the working directory — and on first launch
# quantick copies (never moves) any history it can still reach from the
# cwd-relative era into that home.
#
# [paper]
# trades_dir = "paper-trades"
