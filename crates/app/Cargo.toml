[package]
name = "quantick-app"
description = "Desktop chart for quantick (egui/wgpu planned)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Every capture, demo, automation and fault hook compiles only under one of
# these (or `cfg(test)`); a default build reads no harness `QUANTICK_*` at all.
# `harness` is the whole set, which is what capture workflows build with.
harness = ["quick-range-harness", "drawing-harness", "control-harness", "scenario-harness"]
quick-range-harness = []
drawing-harness = []
control-harness = []
# Launch scenarios, scripted menus and pointers, demo stagers, store isolation
# for captures, and the feed's fault injection.
scenario-harness = ["quantick-feed/harness"]
feed-integrity-harness = ["quantick-feed/live-fixture"]

[dependencies]
quantick-anchored-studies = { path = "../anchored-studies" }
# Bounded admission between the window and its workers, and their progress.
quantick-backpressure = { path = "../backpressure" }
# The headless chart model: bar state, geometry, viewport, style.
quantick-chart = { path = "../chart" }
quantick-workspace = { path = "../workspace" }
quantick-chart-interaction = { path = "../chart-interaction" }
quantick-civil = { path = "../civil" }
quantick-layers = { path = "../layers" }
quantick-control = { path = "../control" }
# Private descriptor publication for the local gateway (ADR 0001). The
# discovery and client halves of the same crate are what the MCP adapter uses.
quantick-control-local = { path = "../control-local" }
# The headless host machinery: projection registry, admission, idempotency, journal.
quantick-control-host = { path = "../control-host" }
# What the control plane says: every projection and action shape.
quantick-control-schema = { path = "../control-schema" }
# The operability contract: the behaviour table, the matrix, the drift comparison.
quantick-operability = { path = "../operability" }
quantick-engine = { path = "../engine" }
quantick-indicator-session = { path = "../indicator-session" }
# The feed host: the FeedEvent/FeedCommand port, the venue adapters that run
# it, and the feed-shaped config types this crate re-exports.
quantick-feed = { path = "../feed" }
quantick-indicators = { path = "../indicators" }
quantick-pine = { path = "../pine" }
quantick-feed-binance = { path = "../feed-binance" }
quantick-feed-hyperliquid = { path = "../feed-hyperliquid" }
quantick-feed-mt5 = { path = "../feed-mt5" }
quantick-orderbook = { path = "../orderbook" }
quantick-orderflow = { path = "../orderflow" }
# The paper account: orders, sizing, the journal and the report numbers. This
# crate keeps the ticket that draws it and the host wiring around it.
quantick-paper = { path = "../paper" }
quantick-replay = { path = "../replay" }
quantick-sim = { path = "../sim" }
# The cockpit stores: every document the chart remembers between launches.
quantick-stores = { path = "../stores" }
quantick-strategy = { path = "../strategy" }
rust_decimal = { workspace = true }
schemars = { workspace = true }
# The user's documents folder (Known Folders on Windows, XDG on Linux) —
# the paper-trading journal's durable default home. Path lookup only; no
# path is ever invented when the platform reports none.
dirs = { workspace = true }
# Bounded non-blocking queues between gateway workers and the application thread.
crossbeam-channel = { workspace = true }
# Operating-system entropy for per-process IDs, nonces, and ephemeral bearer tokens.
getrandom = { workspace = true }
# Native folder picker for Market Replay. Runs off the UI thread, so the OS
# dialog never blocks a frame.
rfd = { workspace = true }
serde = { workspace = true }
# The replay exporter reports progress as NDJSON, the same shape the MT5
# bridge already speaks — read with the same parser rather than a second,
# hand-rolled one.
serde_json = { workspace = true }
smallvec = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
eframe = { workspace = true }
egui-phosphor = { workspace = true }
# The window handle eframe hands out at startup, so `window_scale` can ask the
# platform for the client area it actually has. Already in the tree as eframe's
# own dependency; named here because this crate calls it directly.
raw-window-handle = { workspace = true }
# PNG encoding for the optional evidence screenshot. Already compiled as part
# of this crate's tree (eframe -> image -> png); named here because the
# control plane calls it directly, and because a raster no viewer accepts
# would make an evidence image useless to the human reading the bundle.
png = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Playback of the shipped alarm clips (`assets/alarms/`, see `audio/`). The
# narrowest cut: the output-device half and the AAC-in-MP4 decoder the clips
# need, nothing else — no recording, no other codecs, no dither noise.
# Windows only, like the platform sound beside it: on Linux cpal links ALSA,
# which the CI runner does not carry, and a build there reports "no audio
# backend" for a clip exactly as it already does for a system sound.
rodio = { workspace = true }
# The platform's own attention sounds — the system-scheme half of the alarm
# catalogue. `MessageBeep` is the sound Windows itself uses, and a platform
# without one reports that instead of pretending (see `audio/platform.rs`).
windows-sys = { workspace = true }

[dev-dependencies]
# The gate clock the worker tests park a real worker on, and the ledger
# schedules; the same fixture the crate proves itself with.
quantick-backpressure = { path = "../backpressure", features = ["test-support"] }
# The same crate the `[dependencies]` table already carries, asking for the
# throwaway native the docking port is tested through. Feature resolution
# keeps a dev-dependency's features out of the normal build, so the binary
# `cargo build --workspace` produces ships the two real natives and nothing
# else — while the tests get a third one to prove the app never learned their
# names. See `crates/indicators/src/native/fake.rs`.
quantick-indicators = { path = "../indicators", features = ["fake-native"] }
# The feed's harness hooks, for the same reason: the app's own `cfg(test)`
# compiles its scenario owners, and their registry names the feed's slices.
# `test-support` exercises actual source/host events through the normal app
# drain.
quantick-feed = { path = "../feed", features = ["harness", "test-support"] }
# The per-thread store-write refusal the saves-off tests hold (DS7).
quantick-workspace = { path = "../workspace", features = ["test-support"] }

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }

[lints]
workspace = true
