[package]
name = "quantick-mcp"
description = "MCP adapter for the Quantick control plane: a local STDIO server that discovers an already-running Quantick instance and exposes its observer capabilities as a small, fixed tool set"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "quantick-mcp"
path = "src/main.rs"

[dependencies]
quantick-control = { path = "../control" }
quantick-control-local = { path = "../control-local" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
