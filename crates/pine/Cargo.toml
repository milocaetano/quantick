[package]
name = "quantick-pine"
description = "Quantick Pine: the Pine v5 subset dialect frontend for scripted indicators"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Hand-rolled lexer/parser/compiler — the one permitted dependency is the
# indicator runtime, whose InputSpec/PlotSpec the compile passes produce
# (supply-chain minimalism; full control over spans and errors).
[dependencies]
quantick-indicators = { path = "../indicators" }

[[bench]]
name = "interp"
harness = false

[lints]
workspace = true
