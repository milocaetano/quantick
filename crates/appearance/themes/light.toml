# The title strip (logo, +, menu and window buttons) keeps the order-flow slate
# with Dark's inks, so the logo renders exactly as it does in Dark. Market tabs
# keep this theme's own colours and inks.
[title_strip.colors]
tab_strip = "#252F37"
text_primary = "#D2DAE2"
text_muted = "#96A0AF"
brand = "#3AF0B2"
warn = "#FF6347"
amber = "#F0B90B"
