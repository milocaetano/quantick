flow_key_lit_dot = "#3AF0B2"
flow_key_unlit_dot = "#6B7482"
flow_key_unlit_ink = "#9AA3B0"
flow_gear_ink = "#C9CFD8"
# Dark offers no bulb (it authors no [lit_flow]); the token is here so a theme
# derived from this file is complete.
