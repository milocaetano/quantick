action_ink = "#000000"
modal_scrim = { premultiplied = [0, 0, 0, 90] }
widget_open_border = "#3C3C3C"
widget_active_border = "#FFFFFF"
widget_noninteractive = "#1B1B1B"
widget_shadow = { premultiplied = [0, 0, 0, 96] }
widget_cursor = "#C0DEFF"
widget_error = "#FF0000"
widget_warn = "#FF8F00"
widget_code = "#404040"
drawing_readout_plate = { premultiplied = [14, 18, 26, 216] }
drawing_selection_halo = { premultiplied = [28, 28, 28, 28] }
flow_buy = "#70B9F4"
flow_sell = "#E8AF63"
tape_path = "#8EA6B15F"
tape_label = "#8EA6B1"
quantity_shadow = { premultiplied = [0, 0, 0, 190] }
crosshair_ink = "#FFFFFF"
footprint_total_ink = "#FFFFFF"
loading_logo_low = "#969696"
loading_logo_high = "#D2D2D2"
loading_title = "#D7DDE8"
loading_meta = "#7C8799"
loading_faint = "#4B5566"
loading_border = "#1B2330"
footprint_profile = "#D8D8D8"
footprint_bevel_highlight = { premultiplied = [56, 56, 56, 56] }
footprint_bevel_shadow = { premultiplied = [0, 0, 0, 120] }
canvas = "#131722"
chrome = "#171B26"
inset = "#10141D"
control = "#232936"
chart_grid = "#232936"
# The market tab strip and window title area, the wordmark's "tick" and a
# replaying tab's mark (docs/ux/layout-appearance-2026-11-06).
tab_strip = "#10141D"
brand = "#3AF0B2"
replay_ink = "#C58CFF"
# The tabs: the active tab and the toolbar row
# are one sheet; an idle tab is the strip lifted by #0B0C10 and edged by the
# strip lifted by #323743; the active one wears the band on its top edge.
toolbar_sheet = "#171B26"
tab_idle_fill = "#1B202D"
tab_idle_outline = "#424B60"
tab_band = "#3AF0B2"
# The glow behind the Q while Home is shown, in the band's green. egui blends
# in linear light, so this opacity reads as the mock's ~25% rise at the peak.
home_glow = "#3AF0B210"
# Dark writes its axes in text_muted and rules them in the chart grid's own
# colour, so the rules follow the grid switch: these three are read by light
# themes only, and record what Dark's axes look like by default.
axis_ink = "#96A0AF"
chart_canvas = "#131722"
# Dark's chip wears the candle outline; these are read by light themes only.
last_price_up = "#68E0C9"
last_price_down = "#FF898B"
price_axis_rule = "#232936A6"
time_axis_rule = "#232936A6"
border = "#2E3648"
text_primary = "#D2DAE2"
text_muted = "#96A0AF"
text_faint = "#6E7887"
buy = "#26A69A"
sell = "#EF5350"
poc = "#FFD54F"
accent = "#8AB4F8"
amber = "#F0B90B"
pane_mark = { premultiplied = [190, 156, 63, 217] }
pane_action = "#AAB0BF"
off = "#F29A4B"
capsule_fill = { premultiplied = [8, 10, 15, 189] }
capsule_border = { premultiplied = [23, 23, 23, 23] }
capsule_shadow = { premultiplied = [0, 0, 0, 115] }
bare_hover = { premultiplied = [15, 15, 15, 15] }
seam_line = { premultiplied = [60, 60, 60, 60] }
day_rule = { premultiplied = [30, 30, 30, 30] }
seam_label = { premultiplied = [80, 80, 80, 80] }
warn = "#FF6347"
rec = "#FF4D4D"
gap_line = { premultiplied = [120, 92, 10, 150] }
gap_label = "#9A823A"
tag_bg = "#373F50"
text_support = "#8692A4"
chip_ink = "#0E121A"
casing = { premultiplied = [5, 7, 12, 235] }
draw_violet = "#C58AF9"
draw_cyan = "#4DD0E1"
float_shadow = { premultiplied = [0, 0, 0, 96] }
candle_bull_outline = "#68E0C9"
candle_bear_outline = "#FF898B"
candle_wick = "#A0A9B8"

buy_ink = "#88CEC7"
sell_ink = "#F6A09F"
# The filled replay key is Dark's amber with chip ink; a light theme lays
# dark plates under its replay key, chart order labels and ledger session
# rows instead. Dark paints its order labels on inset with side inks, and
# writes gains and losses in buy_ink and sell_ink.
replay_plate = "#F0B90B"
replay_plate_ink = "#0E121A"
order_plate = "#10141D"
order_plate_ink = "#D2DAE2"
plate_gain = "#88CEC7"
plate_loss = "#F6A09F"
# A hovered control lifts onto the border colour; a resting one is unedged;
# the connection screen's Reconnect is in the loading meta grey.
hover_fill = "#2E3648"
control_edge = "#00000000"
connection_action = "#7C8799"
# A light theme's own gain and loss inks; Dark writes signed amounts in buy
# and sell, which these mirror.
loss_ink = "#EF5350"
bright_gain_ink = "#26A69A"
bright_loss_ink = "#EF5350"
# The trade ledger: a day card one step above the chrome, a bluish session
# box inside it, and the selected trade (docs/layout/trades, option 3).
ledger_card = "#1E2330"
ledger_card_edge = "#2E3648"
ledger_session = "#262E40"
ledger_session_edge = "#34405A"
ledger_selection = "#2B3F63"
# The settings panels' blocks in Dark's own colours: chrome ground, inset
# plates, ledger cards as blocks, the card edge as the band.
panel_ground = "#171B26"
panel_plate = "#10141D"
panel_plate_ink = "#D2DAE2"
panel_block = "#1E2330"
panel_block_edge = "#2E3648"
panel_band = "#2E3648"
panel_band_state = "#96A0AF"
panel_caption = "#96A0AF"
panel_caption_rule = "#2E3648"
panel_footer = "#10141D"
panel_strong_ink = "#D2DAE2"
panel_filter_bar = "#10141D"
panel_live_row = "#262E40"
panel_stripe_loss = "#EF5350"
panel_gain_ink = "#88CEC7"

# Logical pixels. Both families retain the bundled glyph fallback chain.
[typography.heading]
family = "proportional"
size = 18.0
[typography.body]
family = "proportional"
size = 12.5
[typography.button]
family = "proportional"
size = 12.5
[typography.monospace]
family = "monospace"
size = 12.0
[typography.small]
family = "proportional"
size = 9.0
[typography.chart_axis]
family = "monospace"
size = 11.0
[typography.chart_label]
family = "proportional"
size = 11.0
[typography.footprint]
family = "monospace"
size = 10.0
[typography.drawing]
family = "proportional"
size = 12.0

[footprint_heat]
