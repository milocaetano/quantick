drawing_sell = "#EF5350"
drawing_vwap = "#4DD0E1"
drawing_profile = "#8AB4F8"
flow_surface = "#1e2433"
flow_divider = "#3a4357"
flow_ink = "#e8ecf2"
flow_key_down = "#141924"
flow_key_down_shade = { premultiplied = [0, 0, 0, 179] }
flow_key_down_rim = { premultiplied = [0, 0, 0, 102] }
