trade_selection_halo = { premultiplied = [40, 40, 40, 40] }
candle_preview_background = "#0C0F16"
candle_preview_bid = "#14B9E6"
candle_preview_ask = "#F54646"
candle_preview_buy = "#37E2B0D2"
candle_preview_sell = "#FF5B69D2"
retained_tape_shade = "#0000005A"
text_shadow = "#000000"
replay_error = "#5A1E1978"
replay_inset = { premultiplied = [0, 0, 0, 90] }
replay_well = { premultiplied = [0, 0, 0, 60] }
