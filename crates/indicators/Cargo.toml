[package]
name = "quantick-indicators"
description = "Deterministic indicator runtime: engine bars in, plot series out"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
quantick-engine = { path = "../engine" }
rust_decimal = { workspace = true }
# Bit-exact cross-platform transcendentals; the ONLY permitted call path for
# pow/exp/ln/log10 (see src/fmath.rs and the grep-guard test).
libm = { workspace = true }

[features]
# A native that exists only so the docking port can be driven end to end by a
# test: `quantick-app` turns it on in its `[dev-dependencies]` and nowhere
# else, so `cargo build --workspace` never ships it. Not for `--all-features`.
fake-native = []

[[bench]]
name = "eval"
harness = false

[lints]
workspace = true
