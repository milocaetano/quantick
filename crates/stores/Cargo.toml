[package]
name = "quantick-stores"
description = "Headless cockpit stores: the feed catalogue, added symbols, footprint, bubble and indicator presets, the indicator set and the window arrangement, as versioned documents the caller locates"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
quantick-chart = { path = "../chart" }
quantick-engine = { path = "../engine" }
quantick-indicators = { path = "../indicators" }
quantick-orderflow = { path = "../orderflow" }
# The feed-shaped config types and the history reach the catalogue speaks.
quantick-sources = { path = "../sources" }
quantick-workspace = { path = "../workspace" }
rust_decimal = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The approved WIN tape's depth golden feeds the engine an MT5-shaped book.
quantick-orderbook = { path = "../orderbook" }
# The per-thread store-write refusal the saves-off export test holds (DS7).
quantick-workspace = { path = "../workspace", features = ["test-support"] }
# The asset-key move's log line, read back by its test.
tracing-subscriber = { workspace = true }

[lints]
workspace = true
