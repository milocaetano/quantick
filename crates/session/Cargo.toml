[package]
name = "quantick-session"
description = "Headless tab session: one command bus for reaching back, venue candle history and trade-history paging"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The pane's series (`series`): the bar state and the venue prefix in front
# of it, and the history state and view effects a prefix install decides.
quantick-chart = { path = "../chart" }
quantick-chart-interaction = { path = "../chart-interaction" }
# The clock face a history note is written in, and the sentence's time.
quantick-civil = { path = "../civil" }
quantick-engine = { path = "../engine" }
# The desk and account a tab trades on (`paper`).
quantick-paper = { path = "../paper" }
# The candle vocabulary, the history reach and the run that pages toward it.
quantick-sources = { path = "../sources" }
# The Pine scripts a tab's panes arm alarm-only.
quantick-script-trigger = { path = "../script-trigger" }
# The commands and venue events the armed strategies trade in.
quantick-sim = { path = "../sim" }
# The kernel the tab's armed strategies run through.
quantick-strategy = { path = "../strategy" }
quantick-workspace = { path = "../workspace" }
rust_decimal = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The broker double the entry-pause tests route a real account through.
quantick-paper = { path = "../paper", features = ["test-support"] }

[lints]
workspace = true
