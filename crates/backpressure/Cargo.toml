[package]
name = "quantick-backpressure"
description = "Bounded command admission between an owner and its worker: park, fold, count, never drop, and the progress diagnostics that show it holding"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The gate clock and the ledger schedules, for a crate whose tests run real
# workers on this port. A dev-dependency asks for it; nothing shipping does.
test-support = ["dep:serde_json"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
# The envelope watch warns through the same log the window reads.
tracing = { workspace = true }

[dev-dependencies]
# The crate's own schedule tests print their observations as JSON too.
serde_json = { workspace = true }
# The watch's tests read its warnings back as JSON rows.
tracing-subscriber = { workspace = true }

[lints]
workspace = true
