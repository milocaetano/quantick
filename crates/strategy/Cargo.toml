[package]
name = "quantick-strategy"
description = "Deterministic strategy kernel: closed bars and a human-drawn region in, sim commands out"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
quantick-alerts = { path = "../alerts" }
quantick-engine = { path = "../engine" }
# The bar projection and `Indicator` contract a script runs behind.
quantick-indicators = { path = "../indicators" }
# The compiler, the alert titles it reads and the runtime fault it keeps.
quantick-pine = { path = "../pine" }
quantick-sim = { path = "../sim" }
# The one store-write gate (DS7) the bank asks before it writes.
quantick-workspace = { path = "../workspace" }
rust_decimal = { workspace = true }
# The preset bank is a versioned TOML document.
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
