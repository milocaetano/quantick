[package]
name = "quantick-feed"
description = "The feed host: the FeedEvent/FeedCommand port and the venue adapters that run it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Capture and fault-injection hooks (`QUANTICK_FEED_STALL`, `QUANTICK_FEED_GAP`,
# `QUANTICK_BACKFILL`, `QUANTICK_FAKE_LATENCY_SPLIT`). Off in a default build,
# which then reads none of them; `quantick-app`'s `scenario-harness` turns it on.
harness = []
# Literal local transports for cross-crate app tests; absent from normal builds.
test-support = ["dep:futures-util", "dep:tokio-tungstenite"]
# Explicit native evidence harness; never enabled by normal builds.
live-fixture = ["test-support"]

[dependencies]
quantick-engine = { path = "../engine" }
quantick-orderbook = { path = "../orderbook" }
quantick-replay = { path = "../replay" }
# The provider vocabulary and the history reach, declared headless below this host.
quantick-sources = { path = "../sources" }
quantick-feed-binance = { path = "../feed-binance" }
quantick-feed-hyperliquid = { path = "../feed-hyperliquid" }
quantick-feed-mt5 = { path = "../feed-mt5" }
# The async runtimes and the background threads live at this level of the
# graph, never below it. See `README.md`.
tokio = { workspace = true }
# Bounded non-blocking queues between the replay clock and its consumers.
crossbeam-channel = { workspace = true }
# The feed-shaped half of the TOML config: the provider vocabulary and the
# MetaTrader listener settings are deserialized here because they describe
# these adapters, not the chart.
serde = { workspace = true }
# The MT5 bridge speaks NDJSON.
serde_json = { workspace = true }
# Exact prices and quantities across the port; the venue crates speak it too.
rust_decimal = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
# Locating the bridge's own installation under the user's data folder. The
# clock-cache directory is *not* found this way — the application hands it in.
dirs = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
