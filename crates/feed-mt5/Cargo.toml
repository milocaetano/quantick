[package]
name = "quantick-feed-mt5"
description = "MetaTrader 5 tick feed over the local QuantickBridge socket"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Dependency-free and self-timed, the way `engine/benches/hot_path.rs` is: the
# per-print path is what this crate is judged on, and a bench that drags in a
# framework to say so would cost every build for one number.
[[bench]]
name = "tape_burst"
harness = false

[dependencies]
quantick-engine = { path = "../engine" }
quantick-orderbook = { path = "../orderbook" }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
