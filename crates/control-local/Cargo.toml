[package]
name = "quantick-control-local"
description = "Local transport of the Quantick control plane: private instance-descriptor publication and discovery, and the blocking loopback client that speaks the gateway's framed protocol"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
quantick-control = { path = "../control" }
# Platform-private runtime directory lookup (ADR 0001 §4). Path lookup only;
# no path is ever invented when the platform reports none.
dirs = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Verify descriptor ownership against the effective user on Unix platforms.
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Verify descriptor ownership, ACLs, and reparse-point safety on Windows.
windows-sys = { workspace = true }

[lints]
workspace = true
