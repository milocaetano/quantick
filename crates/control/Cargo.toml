[package]
name = "quantick-control"
description = "Transport-neutral contracts and validation for the Quantick control plane"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
jsonschema = { version = "=0.49.9", default-features = false }
regex = "1"
schemars = { version = "=1.2.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
zeroize = "1.8"
