[package]
name = "quantick-control"
description = "Transport-neutral contracts and validation for the Quantick control plane"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The reference fakes (`fake`), for other crates' tests: enabled only from a
# `[dev-dependencies]` entry, so no shipped build compiles them.
fake = []

[dependencies]
base64 = { workspace = true }
jsonschema = { workspace = true }
rust_decimal = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# This crate's own integration tests drive the reference host.
quantick-control = { path = ".", features = ["fake"] }

[[example]]
name = "export_schemas"
required-features = ["fake"]

[lints]
workspace = true
